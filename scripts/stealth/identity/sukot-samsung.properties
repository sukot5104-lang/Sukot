# Sukot — Samsung variant identity.
# Same branding as the default build; only the applicationId changes so this
# APK never collides with the original Lantern app (org.getlantern.lantern),
# any earlier Sukot debug build, or the com.sukot.vpn sideload that may
# already be installed on the device.
applicationId=vpn.sukot.samsung
appLabel=Sukot
launcherLabel=Sukot
identityLabel=Sukot
identityProfileId=sukot-samsung
vpnSessionName=Sukot
notificationChannelVpn=Sukot Status
notificationTitle=Sukot
notificationConnectedText=Sukot VPN is running
notificationStartingText=Starting Sukot VPN...
quickTileActiveLabel=Sukot on
quickTileInactiveLabel=Sukot off
